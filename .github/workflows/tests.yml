name: tests

on:
  # Every branch: work happens on feature branches long before it reaches main.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Lint (correctness rules, see ruff.toml)
        run: ruff check .

      - name: Unit tests
        run: python -m pytest tests -q

      - name: End-to-end verdict self test
        # Runs the real Playwright engine against tests/selftest_app and asserts
        # every scenario reaches its intended verdict. No API key required.
        run: python tests/e2e_selftest.py

      - name: Dependency chain, rules and polling self test
        # Proves STORE / WAIT_FOR_STATE / VERIFY_OPTION_* and rule enforcement
        # against the bundled chain app. Offline, no API key.
        run: python tests/e2e_chain.py

      - name: Recorder self test
        # Runs the injected recorder JS in a real browser. Every other recorder
        # test is a string check, which cannot see that assert mode suppresses
        # the click or that a password never reaches a captured key.
        run: python tests/e2e_recorder.py

      - name: Dashboard smoke test
        run: python tests/smoke_ui.py

      - name: API integration test (CI endpoints, auth, cancellation)
        run: python tests/integration_api.py
